<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Conecta++</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/validacoes.js"></script>
</head>
<body>

    <main class="tela">
        <section class="card cadastro-card" id="etapaCadastro">
            <h1>Faça seu cadastro</h1>

            <form id="formCadastro">
                <input type="text" id="nome" placeholder="Nome completo">
                <input type="email" id="email" placeholder="E-mail">
                <input type="tel" id="telefone" placeholder="Telefone">
                <input type="text" id="cpf" placeholder="CPF">

                <input type="text" id="cep" placeholder="CEP">
                <input type="text" id="numero" placeholder="Número">
                <input type="text" id="rua" placeholder="Rua" readonly>
                <input type="text" id="bairro" placeholder="Bairro" readonly>
                <input type="text" id="cidade" placeholder="Cidade" readonly>
                <input type="text" id="estado" placeholder="Estado" readonly>

                <input type="text"
                       id="dataNascimento"
                       placeholder="Data de nascimento"
                       onfocus="this.type='date'"
                       onblur="if(!this.value){this.type='text'}">

                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </section>

        <section class="card escolha-card hidden" id="etapaEscolha">
            <h1>O que deseja fazer?</h1>

            <div class="botoes-escolha">
                <button type="button" class="btn-opcao" onclick="selecionarOpcao('doar')">
                    Quero doar
                </button>

                <button type="button" class="btn-opcao" onclick="selecionarOpcao('receber')">
                    Quero receber doação
                </button>

                <button type="button" class="btn-opcao" onclick="selecionarOpcao('ambos')">
                    Ambos
                </button>
            </div>
        </section>

        <section class="card mensagem-card hidden" id="etapaMensagem">
            <div class="icone-sucesso">✓</div>

            <h1>Cadastro realizado com sucesso!</h1>

            <p>
                O Sistema de Apoio ao Idoso agradece seu cadastro.<br><br>
                A ONG entrará em contato com você via WhatsApp para mais informações.
            </p>

            <p id="contagemRedirecionamento" class="texto-contagem"></p>

            <a href="index.html" class="btn-azul btn-voltar-inicio">
                Voltar para a Página Inicial
            </a>
        </section>
    </main>
    <section class="card necessidade-card hidden" id="etapaNecessidade">
        <h1 id="tituloNecessidade">Qual é a sua necessidade?</h1>

        <textarea id="necessidadeTexto" placeholder="Escreva aqui sua necessidade"></textarea>

        <button type="button" class="btn-opcao" onclick="irParaSucesso()">
            Continuar
        </button>

        <button type="button" class="btn-voltar-etapa" onclick="voltarParaEscolha()">
            ← Voltar
        </button>
    </section>
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const formCadastro = document.getElementById("formCadastro");

            const etapaCadastro = document.getElementById("etapaCadastro");
            const etapaEscolha = document.getElementById("etapaEscolha");
            const etapaNecessidade = document.getElementById("etapaNecessidade");
            const etapaMensagem = document.getElementById("etapaMensagem");

            /* ========================================= */
            /* CAMPOS */
            /* ========================================= */

            const cepInput = document.getElementById("cep");

            const ruaInput = document.getElementById("rua");
            const bairroInput = document.getElementById("bairro");
            const cidadeInput = document.getElementById("cidade");
            const estadoInput = document.getElementById("estado");

            /* ========================================= */
            /* BUSCAR CEP */
            /* ========================================= */

            async function buscarCep(cepBruto) {

                const cep = cepBruto.replace(/\D/g, "");

                if (cep.length !== 8) {
                    return;
                }

                try {

                    const resposta = await fetch(
                        `https://viacep.com.br/ws/${cep}/json/`
                    );

                    if (!resposta.ok) {
                        throw new Error("Erro ao buscar CEP");
                    }

                    const data = await resposta.json();

                    if (data.erro) {
                        alert("CEP não encontrado.");
                        return;
                    }

                    ruaInput.value = data.logradouro || "";
                    bairroInput.value = data.bairro || "";
                    cidadeInput.value = data.localidade || "";
                    estadoInput.value = data.uf || "";

                    /* campo que o CEP não preencheu fica liberado pra digitar */
                    [ruaInput, bairroInput, cidadeInput, estadoInput].forEach(function (campo) {
                        campo.readOnly = campo.value !== "";
                    });

                } catch (erro) {

                    console.error(erro);

                    alert("Erro ao buscar CEP.");

                }
            }

            cepInput.addEventListener("blur", function () {
                buscarCep(this.value);
            });

            /* ========================================= */
            /* CADASTRO */
            /* ========================================= */

            formCadastro.addEventListener("submit", function (event) {

                event.preventDefault();

                const nome = document.getElementById("nome").value.trim();

                const email = document.getElementById("email").value.trim();

                const telefone = document.getElementById("telefone").value.trim();

                const cpf = document.getElementById("cpf").value.trim();

                const cep = document.getElementById("cep").value.trim();

                const numero = document.getElementById("numero").value.trim();

                const rua = ruaInput.value.trim();

                const bairro = bairroInput.value.trim();

                const cidade = cidadeInput.value.trim();

                const estado = estadoInput.value.trim();

                const dataNascimento = document
                    .getElementById("dataNascimento")
                    .value;

                /* mesmas validações do back-end, na mesma ordem */
                const verificacoes = [
                    [Validacoes.nome(nome), "nome"],
                    [Validacoes.cpf(cpf), "cpf"],
                    [Validacoes.cpfJaCadastrado(cpf) ? "CPF já cadastrado." : "", "cpf"],
                    [Validacoes.telefone(telefone), "telefone"],
                    [Validacoes.emailOpcional(email), "email"],
                    [Validacoes.cep(cep), "cep"],
                    [Validacoes.numeroCasa(numero), "numero"],
                    [Validacoes.rua(rua), "rua"],
                    [Validacoes.bairro(bairro), "bairro"],
                    [Validacoes.cidade(cidade), "cidade"],
                    [Validacoes.estado(estado), "estado"],
                    [Validacoes.dataNascimento(dataNascimento), "dataNascimento"]
                ];

                for (const [mensagem, idCampo] of verificacoes) {
                    if (mensagem) {
                        alert(mensagem);
                        const campo = document.getElementById(idCampo);
                        if (campo) campo.focus();
                        return;
                    }
                }

                /* ========================================= */
                /* ENDEREÇO */
                /* ========================================= */

                const enderecoCompleto =
                    `${rua}, ${numero} - ${bairro}, ${cidade}/${estado}`;

                /* ========================================= */
                /* SALVAR USUÁRIOS */
                /* ========================================= */

                const usuariosCadastrados = JSON.parse(
                    localStorage.getItem("usuariosCadastrados") || "[]"
                );

                usuariosCadastrados.unshift({

                    nome,
                    email,
                    telefone,
                    cpf,

                    endereco: enderecoCompleto,

                    dataNascimento

                });

                localStorage.setItem(
                    "usuariosCadastrados",
                    JSON.stringify(usuariosCadastrados)
                );

                /* ========================================= */
                /* CADASTRO TEMPORÁRIO */
                /* ========================================= */

                const cadastroAtual = {

                    nome,
                    email,
                    telefone,
                    cpf,

                    endereco: enderecoCompleto,

                    dataNascimento

                };

                localStorage.setItem(
                    "cadastroAtual",
                    JSON.stringify(cadastroAtual)
                );

                etapaCadastro.classList.add("hidden");

                etapaEscolha.classList.remove("hidden");

            });

            /* ========================================= */
            /* ESCOLHER OPÇÃO */
            /* ========================================= */

            const tituloNecessidade = document.getElementById("tituloNecessidade");
            const necessidadeTextoInput = document.getElementById("necessidadeTexto");

            const textosPorOpcao = {

                doar: {
                    titulo: "O que você gostaria de doar?",
                    placeholder: "Ex: roupas, brinquedos, móveis, alimentos..."
                },

                receber: {
                    titulo: "Qual é a sua necessidade?",
                    placeholder: "Escreva aqui do que você precisa"
                },

                ambos: {
                    titulo: "Conte um pouco sobre sua doação e sua necessidade",
                    placeholder: "Ex: quero doar roupas e também preciso de móveis..."
                }

            };

            window.selecionarOpcao = function (opcao) {

                localStorage.setItem(
                    "opcaoCadastro",
                    opcao
                );

                const textos = textosPorOpcao[opcao];

                if (textos) {
                    tituloNecessidade.textContent = textos.titulo;
                    necessidadeTextoInput.placeholder = textos.placeholder;
                }

                etapaEscolha.classList.add("hidden");

                etapaNecessidade.classList.remove("hidden");

            };

            window.voltarParaEscolha = function () {

                etapaNecessidade.classList.add("hidden");

                etapaEscolha.classList.remove("hidden");

            };

            /* ========================================= */
            /* FINALIZAR */
            /* ========================================= */

            window.irParaSucesso = function () {

                const necessidade = document
                    .getElementById("necessidadeTexto")
                    .value
                    .trim();

                if (!necessidade) {

                    alert("Escreva sua necessidade.");

                    return;
                }

                const cadastroAtual = JSON.parse(
                    localStorage.getItem("cadastroAtual") || "null"
                );

                const opcao = localStorage.getItem(
                    "opcaoCadastro"
                ) || "";

                if (!cadastroAtual) {

                    alert("Cadastro não encontrado.");

                    return;
                }

                /* ========================================= */
                /* INTERESSES */
                /* ========================================= */

                const interesses = JSON.parse(
                    localStorage.getItem("interessesCadastrados") || "[]"
                );

                interesses.unshift({

                    nome: cadastroAtual.nome,

                    tipo: opcao,

                    necessidade: necessidade,

                    status: "Pendente",

                    dataSolicitacao:
                        new Date().toLocaleDateString("pt-BR")

                });

                localStorage.setItem(
                    "interessesCadastrados",
                    JSON.stringify(interesses)
                );

                /* ========================================= */
                /* LIMPAR */
                /* ========================================= */

                localStorage.removeItem("cadastroAtual");

                localStorage.removeItem("opcaoCadastro");

                /* ========================================= */
                /* TELA SUCESSO */
                /* ========================================= */

                etapaNecessidade.classList.add("hidden");

                etapaMensagem.classList.remove("hidden");

                /* ========================================= */
                /* REDIRECIONAMENTO AUTOMÁTICO */
                /* ========================================= */

                let segundosRestantes = 8;

                const contagemTexto = document.getElementById(
                    "contagemRedirecionamento"
                );

                function atualizarContagem() {

                    contagemTexto.textContent =
                        `Você será redirecionado em ${segundosRestantes} segundos...`;

                    if (segundosRestantes <= 0) {
                        window.location.href = "index.html";
                        return;
                    }

                    segundosRestantes--;

                    setTimeout(atualizarContagem, 1000);

                }

                atualizarContagem();

            };

        });

    </script>

</body>
</html>
