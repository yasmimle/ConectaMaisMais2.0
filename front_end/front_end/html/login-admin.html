<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      background:#f5f5f5;
    }

    .login-box{
      background:white;
      padding:40px;
      border-radius:20px;
      width:400px;
      box-shadow:0 0 20px rgba(0,0,0,0.1);
      text-align:center;
    }

    .login-box h1{
      color:#2f55ff;
      margin-bottom:30px;
      font-size:42px;
    }

    .login-box input{
      width:100%;
      padding:15px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      background:#eee;
      font-size:16px;
      outline:none;
    }

    .login-box button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:50px;
      background:#ff8800;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    .login-box button:hover{
      background:#ff7700;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Administrador</h1>

    <input type="text" id="usuario" placeholder="Digite seu email">
    <input type="password" id="senha" placeholder="Digite sua senha">

    <button type="button" onclick="fazerLogin()">Entrar</button>
  </div>

  <script>
function fazerLogin() {
    const usuario = document.getElementById("usuario").value.trim().toLowerCase();
    const senha = document.getElementById("senha").value.trim();

    if (usuario === "admin" && senha === "1234") {
        localStorage.setItem("tipoUsuario", "administrador");
        window.location.href = "admin.html";
        return;
    }

    if (usuario === "atend" && senha === "1234") {
        localStorage.setItem("tipoUsuario", "atendente");
        localStorage.setItem("atendenteEmail", usuario);
        window.location.href = "atendente.html";
        return;
    }

    alert("Login ou senha incorretos!");
}
</script>
</body>
</html>
